<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <filter id="sticker-diecut-kanji" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" result="DILATED" operator="dilate" radius="8"/>
      <feFlood flood-color="#FFFFFF" result="WHITE"/>
      <feComposite in="WHITE" in2="DILATED" operator="in" result="OUTLINE"/>
      <feMerge>
        <feMergeNode in="OUTLINE"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#sticker-diecut-kanji)">
    <!-- Kanji Background Tag Box -->
    <rect x="40" y="40" width="220" height="220" rx="20" fill="#000000" stroke="#FF003C" stroke-width="8"/>
    <rect x="52" y="52" width="196" height="196" rx="14" fill="#0000FF"/>
    <!-- Bold Kanji Stylized Elements (東京 - Tokyo) -->
    <path d="M75 95 L225 95 M150 70 L150 140 M100 120 L80 150 M195 115 L220 145" stroke="#FFFFFF" stroke-width="14" stroke-linecap="square" fill="none"/>
    <rect x="95" y="150" width="110" height="40" fill="#000000" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M125 195 L95 240 M175 195 L205 240 M150 195 L150 230" stroke="#FFCC00" stroke-width="12" stroke-linecap="square" fill="none"/>
    <text x="150" y="275" font-family="'Archivo Black', sans-serif" font-size="16" fill="#000000" text-anchor="middle">TOKYO STREET TAG</text>
  </g>
</svg>
