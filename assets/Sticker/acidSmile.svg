<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <filter id="sticker-diecut-smile" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" result="DILATED" operator="dilate" radius="8"/>
      <feFlood flood-color="#FFFFFF" result="WHITE"/>
      <feComposite in="WHITE" in2="DILATED" operator="in" result="OUTLINE"/>
      <feMerge>
        <feMergeNode in="OUTLINE"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#sticker-diecut-smile)">
    <!-- Acid Smile Circle Badge -->
    <circle cx="150" cy="150" r="115" fill="#FFCC00" stroke="#000000" stroke-width="12"/>
    <!-- Distorted / Punk Melt Drip -->
    <path d="M150 265 C145 285 130 295 125 280 C120 265 130 260 135 255 Z" fill="#FFCC00" stroke="#000000" stroke-width="8"/>
    <!-- Cross/X Eyes -->
    <line x1="95" y1="100" x2="125" y2="130" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
    <line x1="125" y1="100" x2="95" y2="130" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
    <line x1="175" y1="100" x2="205" y2="130" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
    <line x1="205" y1="100" x2="175" y2="130" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
    <!-- Dripping Grin -->
    <path d="M90 170 C105 225 195 225 210 170" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
    <path d="M140 210 L140 235" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
    <path d="M165 208 L168 230" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
